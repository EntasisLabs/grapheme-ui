[workspace]
resolver = "2"
members = [
    "crates/grapheme-ui",
    "crates/grapheme-ui-cli",
    "examples/counter",
    "examples/counter-desktop",
    "examples/embed",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/EntasisLabs/grapheme-ui"
rust-version = "1.95"

[workspace.dependencies]
grapheme-ui = { path = "crates/grapheme-ui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Language runtime: View IR + headless app session (RFC-0007). No renderer.
# Pinned to the commit that adds StoreSession::set_commit_observer
# (EntasisLabs/grapheme#50) so a task apply can be painted before the task
# returns. Publish order: merge and release that grapheme change first, then
# switch these two lines back to crates.io (version = "0.9.x", same features).
# grapheme-sdk stays on the slim feature. grapheme-runtime defaults are off so
# its default `stage-b` feature does not pull grapheme-aot-container.
grapheme-sdk = { git = "https://github.com/EntasisLabs/grapheme", rev = "8b4482c22c0b1abd476413b1acd80b44e2a8f8fe", default-features = false, features = ["slim"] }
grapheme-runtime = { git = "https://github.com/EntasisLabs/grapheme", rev = "8b4482c22c0b1abd476413b1acd80b44e2a8f8fe", default-features = false }

# Renderer: opt-in at the *application* Cargo.toml (model A). This bridge is
# the only crate that depends on both Grapheme and rndr. rndr never depends
# on Grapheme; Grapheme never depends on rndr or this crate.
# Headless tests use rndr_core + rndr_ui only (no GPU).
rndr_core = { version = "0.5.0", package = "rndr_core" }
rndr_ui = { version = "0.5.0", package = "rndr_ui" }
# Window loop. Off unless a host enables grapheme-ui's `desktop` feature.
rndr = { version = "0.5.0", default-features = false }
rndr_render = { version = "0.5.0", default-features = false }
