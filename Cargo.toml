[workspace]
resolver = "2"
members = [
    "crates/grapheme-ui",
    "examples/counter",
    "examples/counter-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/EntasisLabs/grapheme-ui"
rust-version = "1.95"

[workspace.dependencies]
grapheme-ui = { path = "crates/grapheme-ui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Language runtime: View IR + headless app session (RFC-0007). No renderer.
# Published grapheme 0.8.0 family (grapheme-artifact 0.4.0 comes in transitively).
grapheme-sdk = { version = "=0.8.0", default-features = false, features = ["slim"] }
grapheme-runtime = { version = "=0.8.0" }

# Renderer: opt-in at the *application* Cargo.toml (model A). This bridge is
# the only crate that depends on both Grapheme and rndr. rndr never depends
# on Grapheme; Grapheme never depends on rndr or this crate.
# Published rndr 0.5.0. Headless tests use rndr_core + rndr_ui only (no GPU).
rndr_core = { version = "=0.5.0", package = "rndr_core" }
rndr_ui = { version = "=0.5.0", package = "rndr_ui" }
# Window loop. Off unless a host enables grapheme-ui's `desktop` feature.
rndr = { version = "=0.5.0", default-features = false }
rndr_render = { version = "=0.5.0", default-features = false }
