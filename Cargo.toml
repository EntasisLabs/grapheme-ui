[workspace]
resolver = "2"
members = [
    "crates/grapheme-ui",
    "crates/grapheme-ui-cli",
    "examples/counter",
    "examples/counter-desktop",
    "examples/embed",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/EntasisLabs/grapheme-ui"
rust-version = "1.95"

[workspace.dependencies]
grapheme-ui = { path = "crates/grapheme-ui", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
notify = "6.1.1"

# Language runtime: View IR + headless app session (RFC-0007). No renderer.
# Pinned to the unpublished M8 branch for diagnostic spans and
# StoreSession::reload. Publish grapheme first, then retarget these to the
# crates.io release, then publish grapheme-ui, then grapheme-cli.
# grapheme-sdk stays on the slim feature. grapheme-runtime defaults are off so
# its default `stage-b` feature does not pull grapheme-aot-container.
grapheme-sdk = { git = "https://github.com/EntasisLabs/grapheme", branch = "cursor/m8-dev-loop-6029", default-features = false, features = ["slim"] }
grapheme-runtime = { git = "https://github.com/EntasisLabs/grapheme", branch = "cursor/m8-dev-loop-6029", default-features = false }

# Renderer: opt-in at the *application* Cargo.toml (model A). This bridge is
# the only crate that depends on both Grapheme and rndr. rndr never depends
# on Grapheme; Grapheme never depends on rndr or this crate.
# Headless tests use rndr_core + rndr_ui only (no GPU).
rndr_core = { version = "0.6.0", package = "rndr_core" }
rndr_ui = { version = "0.6.0", package = "rndr_ui" }
# Window loop. Off unless a host enables grapheme-ui's `desktop` feature.
rndr = { version = "0.6.0", default-features = false }
rndr_render = { version = "0.6.0", default-features = false }
