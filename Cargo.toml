[workspace]
resolver = "2"
members = ["crates/grapheme-ui", "examples/counter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/EntasisLabs/grapheme-ui"
rust-version = "1.95"

[workspace.dependencies]
grapheme-ui = { path = "crates/grapheme-ui", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Language runtime: View IR + headless app session (RFC-0007). No renderer.
grapheme-sdk = { git = "https://github.com/EntasisLabs/grapheme", default-features = false, features = ["slim"] }
grapheme-runtime = { git = "https://github.com/EntasisLabs/grapheme" }

# Renderer: opt-in at the *application* Cargo.toml (model A). This bridge is
# the only crate that depends on both Grapheme and rndr. rndr never depends
# on Grapheme; Grapheme never depends on rndr or this crate.
rndr_core = { git = "https://github.com/EntasisLabs/rndr", package = "rndr_core" }
rndr_ui = { git = "https://github.com/EntasisLabs/rndr", package = "rndr_ui" }
