[package]
name = "grapheme-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bridge from Grapheme View IR to rndr: full apps and embeddable surfaces"
readme = "../../README.md"
keywords = ["grapheme", "rndr", "ui", "view-ir"]
categories = ["gui"]

[features]
# Native window. Pulls the rndr facade and the winit/wgpu runner.
# Default builds stay headless (rndr_core + rndr_ui only).
desktop = ["dep:rndr", "dep:rndr_render"]

[dependencies]
grapheme-sdk = { workspace = true }
grapheme-runtime = { workspace = true }
rndr_core = { workspace = true }
rndr_ui = { workspace = true }
rndr = { workspace = true, optional = true, default-features = false }
rndr_render = { workspace = true, optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
